<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ItsTiers</title>
  <link rel="stylesheet" href="style.css">
  <script src="tier-display.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
<div class="header">
<div class="header-left">
<a href="https://itsmoritzzz787.github.io/ItsSubTiers/" target="_blank">
<button class="top-btn2"><img alt="" src="https://mctiers.com/nav_icons/rankings.svg" width="20px"/> ItsSubTiers</button>
</a>
<a href="https://discord.gg/B73DM5KPC" target="_blank">
<button class="top-btn"><img alt="" src="https://mctiers.com/nav_icons/discord.svg" width="20px"/> Discord</button>
</a>
</div>
<div class="header-center">
<img alt="ItsTiers" src="IMG_20260816_141402.png" width="420px"/>
</div>
<div class="header-right">
<input aria-label="Search player" autocomplete="off" disabled="" id="playerSearch" placeholder="Search player..." type="text"/>
</div>
</div>
<div aria-label="Gamemode" class="kit-nav" role="tablist">
<button aria-controls="overall" aria-selected="true" class="kit-tab active" data-kit="overall" id="tab-overall" role="tab" type="button"> <img alt="" class="nav-icon" src="https://mctiers.com/tier_icons/overall.svg" width="20"/><br/>Overall</button>
<button aria-controls="kit1" aria-selected="false" class="kit-tab" data-kit="kit1" id="tab-kit1" role="tab" type="button"><img alt="" class="nav-icon" src="https://mctiers.com/tier_icons/vanilla.svg" width="19px"/><br/>Crystal</button>
<button aria-controls="kit2" aria-selected="false" class="kit-tab" data-kit="kit2" id="tab-kit2" role="tab" type="button"><img alt="" class="nav-icon" src="https://mctiers.com/tier_icons/uhc.svg" width="19"/><br/>UHC</button>
<button aria-controls="kit3" aria-selected="false" class="kit-tab" data-kit="kit3" id="tab-kit3" role="tab" type="button"><img alt="" class="nav-icon" src="https://mctiers.com/tier_icons/pot.svg" width="19"/><br/>Pot</button>
<button aria-controls="kit4" aria-selected="false" class="kit-tab" data-kit="kit4" id="tab-kit4" role="tab" type="button"><img alt="" class="nav-icon" src="https://mctiers.com/tier_icons/nethop.svg" width="18px"/><br/>NethPot</button>
<button aria-controls="kit5" aria-selected="false" class="kit-tab" data-kit="kit5" id="tab-kit5" role="tab" type="button"><img alt="" class="nav-icon" src="https://mctiers.com/tier_icons/smp.svg" width="19px"/><br/>SMP</button>
<button aria-controls="kit6" aria-selected="false" class="kit-tab" data-kit="kit6" id="tab-kit6" role="tab" type="button"><img alt="" class="nav-icon" src="https://mctiers.com/tier_icons/sword.svg" width="17px"/><br/>Sword</button>
<button aria-controls="kit7" aria-selected="false" class="kit-tab" data-kit="kit7" id="tab-kit7" role="tab" type="button"><img alt="" class="nav-icon" src="https://mctiers.com/tier_icons/axe.svg" width="20"/><br/>Axe</button>
<button aria-controls="kit8" aria-selected="false" class="kit-tab" data-kit="kit8" id="tab-kit8" role="tab" type="button"><img alt="" class="nav-icon" src="https://mctiers.com/tier_icons/mace.svg" width="19"/><br/>Mace</button>
<button aria-controls="kit9" aria-selected="false" class="kit-tab" data-kit="kit9" id="tab-kit9" role="tab" type="button"><img alt="" class="nav-icon" src="https://subtiers.net/assets/trident-1c1a3e5a.svg" width="19"/><br/>ChaosMace</button>
<button aria-controls="kit10" aria-selected="false" class="kit-tab" data-kit="kit10" id="tab-kit10" role="tab" type="button"><img alt="" class="nav-icon" src="https://cdn-icons-png.magnific.com/512/6428/6428889.png" width="19"/> <br/> Spear Mace</button>
</div>
<div class="Abtrennung"></div>
<main class="laaanger-background">
  <div id="load-status" class="data-status" role="status">
    <p id="load-message">Loading rankings…</p>
    <button id="retry-load" class="top-btn" type="button" hidden>Try again</button>
  </div>
  <p id="search-status" class="data-status" role="status" hidden></p>
  <div id="ranking-panels" class="kit-wrapper" aria-busy="true">
<section id="overall" class="kit-content active" role="tabpanel" aria-labelledby="tab-overall"></section>
<section id="kit1" class="kit-content" role="tabpanel" aria-labelledby="tab-kit1" hidden></section>
<section id="kit2" class="kit-content" role="tabpanel" aria-labelledby="tab-kit2" hidden></section>
<section id="kit3" class="kit-content" role="tabpanel" aria-labelledby="tab-kit3" hidden></section>
<section id="kit4" class="kit-content" role="tabpanel" aria-labelledby="tab-kit4" hidden></section>
<section id="kit5" class="kit-content" role="tabpanel" aria-labelledby="tab-kit5" hidden></section>
<section id="kit6" class="kit-content" role="tabpanel" aria-labelledby="tab-kit6" hidden></section>
<section id="kit7" class="kit-content" role="tabpanel" aria-labelledby="tab-kit7" hidden></section>
<section id="kit8" class="kit-content" role="tabpanel" aria-labelledby="tab-kit8" hidden></section>
<section id="kit9" class="kit-content" role="tabpanel" aria-labelledby="tab-kit9" hidden></section>
<section id="kit10" class="kit-content" role="tabpanel" aria-labelledby="tab-kit10" hidden></section>
  </div>
  <noscript><p class="data-status">Enable JavaScript to view the rankings.</p></noscript>
</main>
<div id="popup" class="popup" role="dialog" aria-modal="true" aria-labelledby="popup-name" hidden>
  <div class="popup-content">
    <button id="popup-close" class="popup-close" type="button" aria-label="Close player profile">✕</button>
    <h2 id="popup-name" class="Spieler-Name"></h2>
    <div class="popup-skin-wrapper"><img id="popup-skin" class="popup-skin" alt=""></div>
    <div class="popup-info">
      <span id="popup-title" class="popup-title"></span>
      <span id="popup-rank" class="popup-rank"></span>
      <span id="popup-points" class="popup-points"></span>
    </div>
    <h3>TIERS</h3>
    <div id="popup-tiers" class="popup-tiers"></div>
  </div>
</div>
</body>
</html>
